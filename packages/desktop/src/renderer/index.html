<!doctype html>
<html data-theme="light" data-color-scheme="default">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="application-name" content="AionUi" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="AionUi" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#4E5969" />
    <link rel="icon" type="image/png" href="./pwa/icon-192.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./pwa/icon-180.png" />
    <title>AionUi</title>
    <script>
      // Synchronously restore theme appearance from localStorage to prevent theme flash
      (function () {
        try {
          var theme = localStorage.getItem('__aionui_theme');
          if (theme) document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <script>
      // Mobile Fix v3 (2026-08-27): auth-only storage clear + logout timeout
      // fallback + force-logout escape chip. Mobile-only.
      //
      // Why NOT the heavier hacks (removed from this template):
      // - <meta http-equiv="Cache-Control"> is ignored by modern browsers for
      //   actual caching decisions — real headers only.
      // - Per-script ?v= cache busting conflicts with content-hashed asset
      //   filenames and does not cover modulepreload links / internal chunk
      //   imports.
      // - Unregistering the Service Worker on every load races registerPwa()
      //   (register -> unregister -> register churn); sw.js v2 is self-healing
      //   (update polling + skipWaiting + claim) and serves index.html
      //   network-first, scripts/styles network-only.
      // - The window.WebSocket guard with MAX_WS=2 kills the 3rd socket (speech
      //   streaming /api/stt/stream) and races reconnect storms; the JS-layer
      //   isOnLoginPage gating in browser.ts/httpBridge.ts already prevents
      //   pool exhaustion on the login page.
      (function () {
        var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
        if (!isMobile) return;

        console.log('[Mobile Fix v3] Enabled for', navigator.userAgent);

        // 1. Clear JS-visible auth state ONLY (localStorage/sessionStorage/
        // cookies). Deliberately does NOT unregister the Service Worker or
        // delete caches: sw.js v2 is network-first for navigation and
        // network-only for scripts/styles, so fresh content always wins.
        // Wiping caches forces a full re-download of every asset on reload,
        // which stalls on lossy mobile links (5G) and is exactly what made
        // "logout -> re-login" hang.
        function clearAuthStorage() {
          try {
            if (window.localStorage) window.localStorage.clear();
            if (window.sessionStorage) window.sessionStorage.clear();
            var cookies = document.cookie.split(';');
            for (var i = 0; i < cookies.length; i++) {
              var cookie = cookies[i].split('=')[0];
              document.cookie = cookie + '=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/';
            }
            console.log('[Mobile Fix v3] Auth storage cleared');
          } catch (e) {
            console.error('[Mobile Fix v3] Clear error:', e);
          }
        }
        window.forceClearAuthStorage = clearAuthStorage;

        // 2. Logout fetch interceptor with timeout fallback: if POST /logout
        // hangs on a lossy link (5G), still clear local state and reload
        // instead of freezing forever on the logout button.
        var origFetch = window.fetch;
        var LOGOUT_TIMEOUT_MS = 8000;
        window.fetch = function (url, opts) {
          var urlStr = typeof url === 'string' ? url : (url && url.url) || '';
          // The force-logout chip sets this flag so its own request is not
          // double-handled (the chip already redirects explicitly).
          if (window.__forceLogoutFetch) {
            return origFetch.apply(this, arguments);
          }
          if (urlStr.indexOf('logout') !== -1 && opts && (opts.method === 'POST' || opts.method === 'DELETE')) {
            var finished = false;
            var timer = setTimeout(finishLogout, LOGOUT_TIMEOUT_MS);
            function finishLogout() {
              if (finished) return;
              finished = true;
              clearTimeout(timer);
              clearAuthStorage();
              console.log('[Mobile Fix v3] Logout finished, reloading...');
              setTimeout(function () { window.location.reload(true); }, 300);
            }
            var p = origFetch.apply(this, arguments);
            p.then(function (res) {
              if (res.ok || res.status === 200 || res.status === 204) {
                finishLogout();
              } else {
                clearTimeout(timer);
                finished = true; // non-success: let the app's own logout flow handle it
              }
            }).catch(function () {
              finishLogout(); // network error: user still wants out
            });
            return p;
          }
          return origFetch.apply(this, arguments);
        };

        // 3. Force-logout escape chip (mobile only). One code path covers every
        // stuck case (login spin, logout hang): clear local state, best-effort
        // POST /logout, hard redirect. 6s fallback in case the fetch queues
        // forever (Safari connection pool exhaustion).
        window.addEventListener('load', function () {
          var btn = document.createElement('button');
          btn.id = 'force-logout-btn';
          btn.textContent = '强制退出';
          btn.setAttribute('aria-label', '强制退出登录');
          btn.style.cssText =
            'position:fixed;top:12px;right:12px;z-index:999999;background:rgba(255,77,79,0.85);color:#fff;border:none;padding:6px 12px;border-radius:14px;font-size:12px;box-shadow:0 1px 6px rgba(0,0,0,0.25);cursor:pointer;opacity:0.6;';
          btn.onclick = function () {
            if (confirm('确定要强制退出登录吗？将清除本地登录状态并重新加载。')) {
              clearAuthStorage();
              var redirected = false;
              function redirect() {
                if (redirected) return;
                redirected = true;
                window.location.replace('/#/login?force_logout=' + Date.now());
              }
              var fallbackTimer = setTimeout(redirect, 6000);
              window.__forceLogoutFetch = true;
              fetch('/logout', { method: 'POST', credentials: 'include' })
                .catch(function () {})
                .finally(function () {
                  window.__forceLogoutFetch = false;
                  clearTimeout(fallbackTimer);
                  redirect();
                });
            }
          };
          document.body.appendChild(btn);
          console.log('[Mobile Fix v3] Force logout button added');
        });
      })();

      // Set arco-theme on body synchronously
      try {
        var t = localStorage.getItem('__aionui_theme');
        if (t) document.body.setAttribute('arco-theme', t);
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
